name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - uses: extractions/setup-just@v3
        with:
          just-version: '1.43.1'

      - name: Install dependencies
        run: just sync

      - name: Ruff check
        run: just lint

      - name: Ruff format check
        run: just format-check

  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - uses: extractions/setup-just@v3
        with:
          just-version: '1.43.1'

      - name: Install dependencies
        run: just sync

      - name: Pyright
        run: just typecheck

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - uses: extractions/setup-just@v3
        with:
          just-version: '1.43.1'

      - name: Install dependencies
        run: just sync

      - name: Pytest
        run: just test
